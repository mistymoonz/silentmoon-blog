# 将来若恢复中转卡片区，本文件可直接复用；desc/cta 为卡片预留字段
#
# 字段说明：
#   name  快捷图标的 title/aria-label
#   desc  一句话描述（卡片预留）
#   url   目标地址：http 开头自动新窗口打开，mailto 开头唤起邮件客户端
